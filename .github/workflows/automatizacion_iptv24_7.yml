name: Actualización Inteligente IPTV

on:
  schedule:
    # Se ejecuta todos los domingos a las 3:00 AM (Hora Colombia / UTC-5)
    - cron: '0 8 * * 0' 
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  evaluacion_y_actualizacion:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: pip install telethon aiohttp

      - name: Ejecutar Extractor y Bóveda 24/7
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        # Asegúrate de que el nombre del script coincida con el archivo en tu repositorio
        run: python extraccion_telegram.py

      - name: Guardar Cambios en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática: Revisión de lista 24/7 y Bóveda"
          # Es vital incluir ambos archivos para que el sistema de fallos y reputación funcione
          file_pattern: "24_7.m3u boveda_servidores.json"
